agent:
  name: "客服工单 Workflow+RAG"
  version: "3.0.0"
  model: "mock"
  temperature: 0
  max_tokens: 2000
  streaming: false

llm:
  provider: "mock"
  mock:
    seed: 42
    # 各节点延迟模型（ms）：意图识别 / 答复生成 / 澄清 / RAG 检索 / 工具调用 / token
    intent_latency_ms: 550
    intent_jitter_ms: 100
    generation_latency_ms: 600
    generation_jitter_ms: 120
    clarification_latency_ms: 500
    clarification_jitter_ms: 100
    rag_search_latency_ms: 50
    rag_search_jitter_ms: 15
    tool_latency_ms: 40
    tool_jitter_ms: 10
    token_latency_ms: 40
    # 成本假设：本地量化模型部署口径（见课程正文的成本口径说明）
    token_price_per_1k: 0.15

routing:
  # 意图识别节点出边（互斥分支，按声明顺序取值，default 兜底）
  intent_edges:
    - condition: "intent in ['order_info', 'logistics_query', 'delivery_time']"
      target: data_retrieval
    - condition: "intent in ['return_policy', 'knowledge', 'after_sale']"
      target: knowledge_retrieval
  clarification_intents: ["clarification", "ambiguous"]
  # 答复生成后置信度分支
  confidence_edge:
    condition: "confidence >= 0.8"
    target_branch: auto_reply
    fallback_branch: human_transfer
  confidence_threshold: 0.8

workflow:
  max_node_executions: 10
  node_timeout_ms: 5000
  max_retries: 2
  retry_backoff_ms: 50

rag:
  knowledge_base: "customer-service-kb"
  # 检索模式：仅实现进程内 BM25（+规则重排）。hybrid 未实现，显式配置
  # 会在服务启动时报配置错误；历史报告中 search_mode=hybrid 为当时的
  # 配置标签，实际算法始终为 BM25（课程 RAG 口径说明）
  search_mode: "bm25"
  top_k: 5
  score_threshold: 0.30
  vector_top_k: 10
  keyword_top_k: 10
  rerank: true
  # 轻量确定性向量维度（无外部 Embedding 模型的占位实现）
  vector_dim: 256

checkpoint:
  enabled: true
  retry_idempotent: true
  # 存储后端：memory（进程内字典，重启即丢）/ sqlite（持久化，跨重启续跑）
  # 环境变量 FLOW_CHECKPOINT_STORE / FLOW_CHECKPOINT_DB 优先
  store: "memory"
  db_path: "data/checkpoints.db"
  # 生命周期：completed 终态的检查点不再需要续跑，即时清理；
  # 遗留检查点（故障后从未续跑）按存活时长与总量上限回收
  # 环境变量 FLOW_CHECKPOINT_PURGE_ON_COMPLETED / _GC_MAX_AGE_S / _GC_MAX_COUNT 优先
  purge_on_completed: true
  gc_max_age_s: 86400      # 保留时长上限（秒），超期回收；0=关闭
  gc_max_count: 1000       # 检查点总量上限，超量按最旧回收；0=关闭
  gc_every_saves: 64       # 每存档 N 次触发一次 GC（节流，不进运行指纹）

fault:
  inject:
    enabled: false
    target: ""            # intent_recognition / data_retrieval / knowledge_retrieval / response_generation / clarity
    mode: ""              # timeout / error / down
    latency_ms: 3000
    limit: 0              # 0=持续注入；N=注入前 N 次后停止（自愈/恢复测试）
    node_id: ""           # 指定命中节点名称（留空则命中 target 类型节点）

gates:
  rules:
    accuracy:
      type: "accuracy"
      threshold: 0.98
    latency:
      type: "performance"
      threshold: 8000        # ms（e2e P90，v2 流式口径重标定，原 v1 非流式 5000，见课程正文对应段落）
    branch_coverage:
      type: "coverage"
      threshold: 0.90
    security:
      type: "security"
      threshold: 0
    cost_per_qualified:
      type: "cost"
      threshold: 0.5         # 元/合格业务
    stability:
      type: "stability"
      threshold: 0.995
      error_rate_max: 0.005

# 时延 SLO（与测量口径联动：v2 完整接口口径含逐字答复流，约 40ms/字，
# 由 v1 非流式 5000ms 重标定；首字为新增 TTFT 口径指标。压测脚本读取本节）
#
# 两套口径并存，按被测模型选择，不可互相顶替：
# - mock 口径：确定性 mock 延迟模型，供可复现的长跑/回归基线使用；
# - real_model 口径：真实推理型模型（含思考链），时延量级不同。
#   real_model 门槛按 24 次分层观测的 P90 × 约 1.3 倍余量定（见课程正文对应段落），
#   不是把 mock 门槛放宽——两者测量对象不同，读数也不可互比。
slo:
  e2e_ms: 8000              # mock 口径：完整答复 E2E（流式，覆盖 150 字答复 + 前置耗时 + 抖动）
  first_answer_ms: 2000     # mock 口径：首字 P90（TTFT；实测约 1.0-1.4s）
  real_model:
    e2e_ms: 30000           # 真实模型：修复前观测 P90 22962ms × 约 1.3（修复后 21619ms）
    first_answer_ms: 8000   # 真实模型：修复前观测 P90 6356ms × 约 1.3（修复后 6663ms）
                            # 两次样本与逐笔达标率见课程正文对应段落

limits:
  max_iterations: 10
  max_tool_calls: 5          # 单次运行工具尝试上限（含自动重试，根预算原子分配）
  request_timeout: 30
  tool_workers: 4            # 数据检索节点的共享工具并发线程上限
  tool_queue_size: 16        # 等待槽上限；满时明确返回过载失败
  context_window_tokens: 8192  # 上下文窗口上限：占用率指标分母（教学口径，CONTEXT_WINDOW_TOKENS 可覆盖）

monitoring:
  enable_trace: true
  enable_metrics: true
  log_level: "info"
# 观测导出：自托管 Langfuse（见 Langfuse 官方文档）
# 环境变量 LANGFUSE_ENABLED / LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY /
# LANGFUSE_SECRET_KEY 优先于本文件；密钥占位符不得提交真实值
observability:
  langfuse:
    enabled: false
    host: "http://localhost:3000"
    public_key: ""
    secret_key: ""
    timeout_s: 5
